<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A0A2E"/>
      <stop offset="100%" stop-color="#0D0518"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Border glow -->
  <rect width="64" height="64" rx="14" fill="none"
        stroke="#B45AFF" stroke-width="1.5" opacity="0.5"/>

  <!-- N letterform with neon glow -->
  <g filter="url(#glow)">
    <polyline
      points="13,49 13,15 51,49 51,15"
      stroke="#00FF88"
      stroke-width="5.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"/>
  </g>

  <!-- Network nodes at corners -->
  <circle cx="13" cy="15" r="4.5" fill="#B45AFF"/>
  <circle cx="51" cy="15" r="4.5" fill="#B45AFF"/>
  <circle cx="13" cy="49" r="4.5" fill="#00FF88"/>
  <circle cx="51" cy="49" r="4.5" fill="#00FF88"/>
</svg>
