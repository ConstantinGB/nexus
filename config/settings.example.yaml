ai:
  # Active provider: anthropic | openwebui | openai_compat | local
  provider: anthropic

  providers:
    anthropic:
      api_key: ""       # or set ANTHROPIC_API_KEY env var
    openwebui:
      base_url: "http://localhost:3000"
      api_key:  ""      # key issued by your OpenWebUI instance
    openai_compat:
      base_url: ""      # e.g. http://localhost:8000
      api_key:  ""
      model:    ""
    local:
      endpoint: "http://localhost:11434"
      model:    "llama3.2"

  # Per-capability model overrides (leave model blank to use the default)
  # model_mode: basic   # basic | advanced
  # models:
  #   reasoning:        {enabled: true,  model: ""}
  #   coding:           {enabled: true,  model: ""}
  #   embedding:        {enabled: false, model: ""}
  #   instruct:         {enabled: true,  model: ""}
  #   function_calling: {enabled: true,  model: ""}
  #   vision:           {enabled: true,  model: ""}
  #   stt_tts:          {enabled: false, model: ""}

mcp:
  servers: {}
    # Example: GitHub MCP server
    # github:
    #   command: npx
    #   args: ["-y", "@modelcontextprotocol/server-github"]
    #   env:
    #     GITHUB_TOKEN: "ghp_..."
